name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Build (warnings as errors)
        run: gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -O2 banking_ops.c -o banking_ops -lm
      - name: Smoke test
        run: sh tests/smoke_test.sh ./banking_ops
